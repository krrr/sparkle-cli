name: 'Performance Tests: Nightly'

on:
  workflow_dispatch: # Allow manual trigger (nightly schedule disabled; was cron '0 3 * * *')

permissions:
  contents: 'read'

jobs:
  perf-test:
    name: 'Run Performance Usage Tests'
    runs-on: 'ubuntu-latest'
    if: false # Disabled
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5
        with:
          persist-credentials: false

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020' # ratchet:actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 'Build vendored ink fork'
        uses: './.github/actions/build-vendored-ink'

      - name: 'Install dependencies'
        run: 'npm ci'

      - name: 'Build project'
        run: 'npm run build'

      - name: 'Run Performance Tests'
        run: 'npm run test:perf'
