    <text x="567" y="19" fill="#afafaf" textLength="9" lengthAdjust="spacingAndGlyphs" font-weight="bold">q</text>
    <text x="9" y="36" fill="#afafaf" textLength="54" lengthAdjust="spacingAndGlyphs">Sort: </text>
    <text x="63" y="36" fill="#afafaf" textLength="9" lengthAdjust="spacingAndGlyphs" font-weight="bold">s</text>
    <text x="72" y="36" fill="#afafaf" textLength="162" lengthAdjust="spacingAndGlyphs">         Reverse: </text>
    <text x="234" y="36" fill="#afafaf" textLength="9" lengthAdjust="spacingAndGlyphs" font-weight="bold">r</text>
    <text x="243" y="36" fill="#afafaf" textLength="162" lengthAdjust="spacingAndGlyphs">      First/Last: </text>
    <text x="405" y="36" fill="#afafaf" textLength="27" lengthAdjust="spacingAndGlyphs" font-weight="bold">g/G</text>
    <text x="27" y="70" fill="#afafaf" textLength="45" lengthAdjust="spacingAndGlyphs" font-weight="bold">Index</text>
    <text x="72" y="70" fill="#afafaf" textLength="27" lengthAdjust="spacingAndGlyphs"> │ </text>
    <text x="99" y="70" fill="#afafaf" textLength="36" lengthAdjust="spacingAndGlyphs" font-weight="bold">Msgs</text>
    <text x="135" y="70" fill="#afafaf" textLength="27" lengthAdjust="spacingAndGlyphs"> │ </text>
    <text x="162" y="70" fill="#afafaf" textLength="27" lengthAdjust="spacingAndGlyphs" font-weight="bold">Age</text>
    <text x="198" y="70" fill="#afafaf" textLength="27" lengthAdjust="spacingAndGlyphs"> │ </text>
    <text x="225" y="70" fill="#afafaf" textLength="36" lengthAdjust="spacingAndGlyphs" font-weight="bold">Name</text>
    <rect x="9" y="85" width="36" height="17" fill="#005f00" />
