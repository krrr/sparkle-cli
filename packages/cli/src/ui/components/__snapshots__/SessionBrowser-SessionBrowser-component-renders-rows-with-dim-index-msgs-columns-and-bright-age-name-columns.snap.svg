    <rect x="342" y="85" width="549" height="17" fill="#005f00" />
    <text x="27" y="104" fill="#afafaf" textLength="18" lengthAdjust="spacingAndGlyphs">#2</text>
    <text x="72" y="104" fill="#afafaf" textLength="36" lengthAdjust="spacingAndGlyphs"> │ 7</text>
    <text x="135" y="104" fill="#afafaf" textLength="27" lengthAdjust="spacingAndGlyphs"> │ </text>
    <text x="162" y="104" fill="#ffffff" textLength="36" lengthAdjust="spacingAndGlyphs">10mo</text>
    <text x="198" y="104" fill="#afafaf" textLength="27" lengthAdjust="spacingAndGlyphs"> │ </text>
    <text x="225" y="104" fill="#ffffff" textLength="126" lengthAdjust="spacingAndGlyphs">Second session</text>
    <text x="9" y="121" fill="#afafaf" textLength="9" lengthAdjust="spacingAndGlyphs">▼</text>
