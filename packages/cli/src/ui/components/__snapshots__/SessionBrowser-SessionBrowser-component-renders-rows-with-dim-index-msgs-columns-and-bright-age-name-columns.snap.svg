    <text x="369" y="19" fill="#afafaf" textLength="9" lengthAdjust="spacingAndGlyphs" font-weight="bold">/</text>
    <text x="378" y="19" fill="#afafaf" textLength="99" lengthAdjust="spacingAndGlyphs">   Delete: </text>
    <text x="477" y="19" fill="#afafaf" textLength="9" lengthAdjust="spacingAndGlyphs" font-weight="bold">d</text>
