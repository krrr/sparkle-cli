<svg xmlns="http://www.w3.org/2000/svg" width="920" height="156" viewBox="0 0 920 156">
  <style>
    text { font-family: Consolas, "Courier New", monospace; font-size: 14px; dominant-baseline: text-before-edge; white-space: pre; }
  </style>
  <rect width="920" height="156" fill="#000000" />
  <g transform="translate(10, 10)">
    <text x="9" y="2" fill="#d7afff" textLength="207" lengthAdjust="spacingAndGlyphs">Chat Sessions (2 total)</text>
    <text x="720" y="2" fill="#afafaf" textLength="171" lengthAdjust="spacingAndGlyphs">sorted by date desc</text>
    <text x="9" y="19" fill="#afafaf" textLength="90" lengthAdjust="spacingAndGlyphs">Navigate: </text>
    <text x="99" y="19" fill="#afafaf" textLength="27" lengthAdjust="spacingAndGlyphs" font-weight="bold">↑/↓</text>
