    <rect x="45" y="85" width="27" height="17" fill="#005f00" />
    <rect x="72" y="85" width="36" height="17" fill="#005f00" />
    <text x="72" y="87" fill="#d7ffd7" textLength="36" lengthAdjust="spacingAndGlyphs"> │ 3</text>
    <rect x="108" y="85" width="27" height="17" fill="#005f00" />
    <rect x="135" y="85" width="207" height="17" fill="#005f00" />
